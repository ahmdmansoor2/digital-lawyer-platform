<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#164e63"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.55"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.28"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="rgba(6,182,212,0.5)"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#halo)"/>
  <g opacity="0.07">
    <circle cx="180" cy="540" r="260" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="180" cy="540" r="180" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="1020" cy="120" r="260" fill="none" stroke="#fff" stroke-width="1.5"/>
    <circle cx="1020" cy="120" r="180" fill="none" stroke="#fff" stroke-width="1.5"/>
  </g>
  <rect x="470" y="210" width="260" height="260" rx="60" fill="url(#glow)" filter="url(#shadow)"/>
  <rect x="470" y="210" width="260" height="260" rx="60" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <text x="600" y="382" font-size="150" text-anchor="middle" dominant-baseline="central">🏢</text>
  <rect x="300" y="520" width="600" height="4" rx="2" fill="#06b6d4" opacity="0.6"/>
  <text x="600" y="570" font-size="34" font-weight="700" fill="#e2e8f0" text-anchor="middle" font-family="Cairo, sans-serif">كيف تؤسس شركة في مصر: الأنواع والإجراءات والأوراق المطلوبة</text>
  <text x="600" y="612" font-size="20" fill="#94a3b8" text-anchor="middle" font-family="Cairo, sans-serif">منصة المحامي الرقمية • الشركات</text>
