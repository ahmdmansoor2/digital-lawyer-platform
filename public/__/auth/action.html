<body>
  <div class="card">
    <div class="icon">🔐</div>
    <h1>إعادة تعيين كلمة المرور</h1>
    <p class="sub" id="sub">جارٍ التحقق من الرابط...</p>
    <form id="resetForm" style="display:none">
      <label for="newPassword">كلمة المرور الجديدة</label>
      <input type="password" id="newPassword" placeholder="6 أحرف على الأقل" minlength="6" required autocomplete="new-password" />
      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input type="password" id="confirmPassword" placeholder="أعد إدخال كلمة المرور" minlength="6" required autocomplete="new-password" />
      <button type="submit" id="submitBtn">تعيين كلمة المرور الجديدة</button>
    </form>
    <div id="msg" class="msg"></div>
    <a href="/?from=reset" class="back-link">← العودة إلى المنصة</a>
    <div class="footer">© 2026 | المحامي الرقمي</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import {
      getAuth,
      verifyPasswordResetCode,
      confirmPasswordReset
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCYzLif-sT3dFqezeHJnRvK0o52ENBMzu4",
      authDomain: "justice-91571.firebaseapp.com",
      projectId: "justice-91571",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const sub = document.getElementById('sub');
    const form = document.getElementById('resetForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showMsg(text, type) {
      msg.className = 'msg show ' + type;
      msg.textContent = text;
    }

    // استخراج oobCode من URL
    const params = new URLSearchParams(window.location.search);
    const oobCode = params.get('oobCode');
    const mode = params.get('mode');

    if (!oobCode | mode !== 'resetPassword') {
      sub.textContent = 'رابط غير صالح أو منتهي الصلاحية';
      showMsg('الرابط غير صالح. اطلب رابطاً جديداً من شاشة تسجيل الدخول.', 'error');
      throw new Error('Invalid oobCode');
    }

    // التحقق من صحة الكود
    try {
      const email = await verifyPasswordResetCode(auth, oobCode);
      sub.textContent = 'أدخل كلمة مرور جديدة للحساب: ' + email;
      form.style.display = 'block';
    } catch (err) {
      console.error('Verify error:', err);
      sub.textContent = 'الرابط منتهي الصلاحية أو غير صالح';
      if (err.code === 'auth/invalid-action-code') {
        showMsg('انتهت صلاحية الرابط أو تم استخدامه. اطلب رابطاً جديداً من شاشة "نسيت كلمة المرور".', 'error');
      } else if (err.code === 'auth/expired-action-code') {
        showMsg('انتهت صلاحية الرابط. اطلب رابطاً جديداً من شاشة "نسيت كلمة المرور".', 'error');
      } else {
        showMsg('حدث خطأ: ' + (err.message | err.code), 'error');
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        showMsg('كلمتا المرور غير متطابقتين', 'error');
        return;
      }
      if (newPassword.length < 6) {
        showMsg('كلمة المرور يجب أن تكون 6 أحرف على الأقل', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = 'جاري الحفظ<span class="loader"></span>';

      try {
        await confirmPasswordReset(auth, oobCode, newPassword);
        form.style.display = 'none';
        sub.textContent = '✅ تم تغيير كلمة المرور بنجاح!';
        showMsg('تم حفظ كلمة المرور الجديدة. يمكنك الآن تسجيل الدخول بحسابك.', 'success');
        // إعادة التوجيه لصفحة تسجيل الدخول بعد 3 ثوان
        setTimeout(() => { window.location.href = '/?from=reset&password_changed=1'; }, 3000);
      } catch (err) {
        console.error('Confirm reset error:', err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'تعيين كلمة المرور الجديدة';
        if (err.code === 'auth/weak-password') {
          showMsg('كلمة المرور ضعيفة. استخدم 6 أحرف على الأقل مع أحرف وأرقام.', 'error');
        } else if (err.code === 'auth/invalid-action-code') {
          showMsg('انتهت صلاحية الرابط. اطلب رابطاً جديداً.', 'error');
        } else {
          showMsg('فشل تغيير كلمة المرور. حاول مرة أخرى.', 'error');
        }
      }
    });
  </script>
