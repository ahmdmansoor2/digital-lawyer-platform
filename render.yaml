services:
  - type: web
    name: mohamidigital-telegram-assistant
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: node scripts/telegram-bot/assistant.cjs
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
