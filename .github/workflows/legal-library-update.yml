name: 📚 الناشر الأسبوعي — المكتبة القانونية

on:
  schedule:
    # الاثنين 8:00 ص توقيت القاهرة (UTC+3 في الصيف)
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  library-update:
    name: توليد أدلة المكتبة القانونية عبر Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate legal library topics (Gemini)
        run: node scripts/seo/generate-legal-library.cjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true

      - name: Regenerate sitemap + search index
        run: |
          node scripts/blog-publisher/generate-sitemap.cjs
          node scripts/seo/build-search-index.cjs

      - name: Commit & Push changes
        run: |
          git config user.name  "Legal Library Bot 📚"
          git config user.email "bot@justice-91571.web.app"
          git add public/legal-library.html public/legal-library-topics/ scripts/seo/legal-library-topics.json public/sitemap.xml public/sitemap.html public/search-index.json
          git diff --staged --quiet || git commit -m "📚 Legal-library: $(date +'%Y-%m-%d %H:%M') — أدلة قانونية عبر Gemini + إحصاءات حقيقية"
          git pull --rebase origin main 2>/dev/null || true
          git push

      - name: Build & Deploy to Firebase Hosting
        run: |
          npm run build
          rm -f .firebase/hosting.*.cache
          npx firebase deploy --only hosting:app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
