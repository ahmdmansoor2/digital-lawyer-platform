name: 🎬 الناشر اليومي — TikTok (فيديو قانوني يومياً)

on:
  # ⏸️ الجدولة اليومية موقوفة مؤقتاً — لا توجد توكنز TikTok في GitHub secrets
  # (TIKTOK_ACCESS_TOKEN / REFRESH_TOKEN / OPEN_ID / EXPIRES_IN). إعادة التفعيل:
  # بعد إضافة الـ secrets، أزل التعليق عن السطر التالي وأدفع.
  # schedule:
  #   - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  tiktok-publish:
    name: فيديو TikTok من ترندات جوجل + مقالات المدونة
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Arabic fonts (Noto — للكابشن داخل الفيديو)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Bootstrap TikTok tokens (only if tiktok-tokens.json missing)
        run: |
          if [ ! -f scripts/tiktok-publisher/tiktok-tokens.json ]; then
            node scripts/tiktok-publisher/oauth-handler.cjs import
          else
            echo "✅ tiktok-tokens.json موجود (refresh_token المحدّث من آخر تشغيل)"
          fi
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          TIKTOK_OPEN_ID: ${{ secrets.TIKTOK_OPEN_ID }}
          TIKTOK_EXPIRES_IN: ${{ secrets.TIKTOK_EXPIRES_IN }}
          TIKTOK_REFRESH_EXPIRES_IN: ${{ secrets.TIKTOK_REFRESH_EXPIRES_IN }}
          CI: true

      - name: Generate & publish TikTok video
        run: node scripts/tiktok-publisher/tiktok-publish.cjs --count 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EDGE_TTS_VOICE: ar-EG-ShakirNeural
          CI: true

      - name: Commit & Push changes (persist rotated tokens + publish log)
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "Smart Legal TikTok 🤖"
          git config user.email "bot@justice-91571.web.app"
          git add -A scripts/tiktok-publisher 2>/dev/null || git add scripts/tiktok-publisher
          if git diff --cached --quiet; then
            echo "✅ لا تغييرات — لا توكنز ولا سجلات جديدة"
          else
            git commit -m "🎬 TikTok-publish: $(date +'%Y-%m-%d %H:%M') — فيديو قانوني من الترندات"
            git pull --rebase origin main 2>/dev/null || true
            git push
          fi
