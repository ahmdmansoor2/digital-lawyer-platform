name: 🎬 الناشر اليومي — ريلز فيسبوك (5 مرات يومياً من ترندات جوجل)

on:
  schedule:
    # بعد الناشر الذكي بخمس دقائق (يولّد ترندات اليوم أولاً)
    # 9:05 ص، 12:05 ظ، 3:05 ع، 6:05 م، 9:05 م (توقيت القاهرة UTC+3)
    - cron: '5 6,9,12,15,18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reel-publish:
    name: ريلز فيسبوك من ترندات جوجل
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Print ffmpeg version (تشخيص)
        run: node_modules/ffmpeg-static/ffmpeg -version | head -n 1

      - name: Install Arabic fonts (Noto — للكابشن داخل الفيديو)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Generate & publish Facebook Reel (from Google Trends)
        run: node scripts/facebook-publisher/reel-publisher.cjs --count 1
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CI: true

      - name: Bootstrap YouTube tokens (only if youtube-tokens.json missing)
        run: |
          if [ ! -f scripts/youtube-publisher/youtube-tokens.json ]; then
            node scripts/youtube-publisher/youtube-oauth.cjs import
          else
            echo "✅ youtube-tokens.json موجود"
          fi
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPIRES_IN: ${{ secrets.YT_EXPIRES_IN }}
          CI: true

      - name: Publish reel to YouTube (channel فيروز)
        run: node scripts/youtube-publisher/youtube-publish.cjs --from-fb-log
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_ACCESS_TOKEN: ${{ secrets.YT_ACCESS_TOKEN }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_EXPIRES_IN: ${{ secrets.YT_EXPIRES_IN }}
          CI: true

      - name: Commit published log back
        run: |
          git config user.name  "Smart Reels Bot 🤖"
          git config user.email "bot@justice-91571.web.app"
          git add scripts/facebook-publisher/facebook-published-log.json scripts/youtube-publisher/youtube-tokens.json scripts/youtube-publisher/youtube-published-log.json
          if ! git diff --cached --quiet; then
            git commit -m "🎬 Reel-publish: $(date +'%Y-%m-%d %H:%M') — ريلز من ترندات جوجل"
            git pull --rebase origin main 2>/dev/null || true
            git push || echo "⚠️ push تعذر — سيُلتقط في التشغيل التالي"
          else
            echo "✅ لا تغييرات — كل المواضيع منشورة مسبقاً"
          fi
