name: 🃏 الناشر اليومي — بطاقات تعليمية على فيسبوك (ترند جوجل)

on:
  schedule:
    # بعد الناشر الذكي (يولّد ترندات اليوم 9:00 ص) وبعد أول ريلز (9:05 ص)
    # 10:00 صباحاً (توقيت القاهرة UTC+3) — ياخد الترند الأعلى غير المنشور
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  card-publish:
    name: بطاقة تعليمية من ترندات جوجل
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Arabic fonts (Noto — لتوليد البطاقة عبر librsvg)
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core

      - name: Generate & publish educational card (top Google trend)
        run: node scripts/facebook-publisher/card-publisher.cjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CI: true

      - name: Commit published log back
        run: |
          git config user.name  "Card Bot 🃏"
          git config user.email "bot@justice-91571.web.app"
          git add scripts/facebook-publisher/facebook-cards-published-log.json
          if ! git diff --cached --quiet; then
            git commit -m "🃏 Card-publish: $(date +'%Y-%m-%d %H:%M') — بطاقة تعليمية من ترند جوجل"
            git pull --rebase origin main 2>/dev/null || true
            git push || echo "⚠️ push تعذر — سيُلتقط في التشغيل التالي"
          else
            echo "✅ لا تغييرات — كل الترندات منشورة بطاقات مسبقاً"
          fi
