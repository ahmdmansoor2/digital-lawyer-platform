name: 🌐 الناشر التخصصي الذكي — تغذية صفحات الموقع (مبادئ النقض + صيغ الدعاوى + التشخيص)

on:
  schedule:
    # يومياً الساعة 2:00 ظهراً بتوقيت القاهرة (11:00 UTC)
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  multipage-publish:
    name: نشر وتغذية تخصصية لكافة صفحات المنصة
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Multi-Page Smart Publisher
        run: node scripts/multipage-publisher.cjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true

      - name: Regenerate Sitemaps
        run: node scripts/generate-sitemap.cjs

      - name: Commit & Push Changes
        run: |
          git config user.name  "Multi-Page Legal Bot 🌐"
          git config user.email "bot@mohamidigital.online"
          git add public/court-precedents.html public/data/ scripts/multipage-published-log.json public/sitemap.xml public/sitemap.html
          if ! git diff --cached --quiet; then
            git commit -m "🌐 Multi-Page Publish: $(date +'%Y-%m-%d %H:%M') — مبادئ نقض + صيغ جديدة"
            git pull --rebase origin main 2>/dev/null || true
            git push || echo "⚠️ push تعذر — سيُلتقط في الدورة التالية"
          else
            echo "✅ لا تغييرات جديدة للتسجيل"
          fi

      - name: Build production bundle
        run: npm run build

      - name: Deploy to Firebase Hosting (app target)
        run: |
          npx firebase deploy --only hosting:app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Submit URLs to IndexNow
        run: node scripts/submit-indexnow.cjs
        if: success()
