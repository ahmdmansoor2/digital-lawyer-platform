name: 📚 رفع كتب المكتبة إلى Internet Archive (cloud-safe)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'وضع التشغيل'
        required: false
        default: 'default'
        type: choice
        options:
          - default       # تخطَّ الـ done + failed
          - retry-failed  # أعد الـ failed
          - only-failed   # الـ failed بس
  schedule:
    # كل 6 ساعات: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  ia-upload:
    name: رفع الكتب إلى mohamidigital-library على Internet Archive
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 ساعات (الحد الأقصى لـ GitHub Actions)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تحقّق من وجود سجل الرفع (للإكمال)
        id: log-check
        run: |
          if [ -f scripts/ia-upload-log.json ]; then
            DONE=$(node -e "console.log(require('./scripts/ia-upload-log.json').done.length)")
            FAILED=$(node -e "console.log(require('./scripts/ia-upload-log.json').failed.length)")
            echo "done=$DONE" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "📊 السجلّ: $DONE done | $FAILED failed"
          else
            echo "done=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "📊 لا سجلّ بعد — بداية جديدة"
          fi

      - name: تنزيل أرشيف الكتب من GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p .ia-books
          echo "📥 جاري تنزيل books-archive-v1 assets..."
          # يحمّل كل الـ .tar من release 'books-archive-v1' (متطابق مع الاسم الذي أنشأناه)
          gh release download books-archive-v1 \
            --pattern 'books-part-*.tar' \
            --dir .ia-books \
            --clobber
          ls -lh .ia-books/

      - name: استخراج الكتب (4 tars → مجلد واحد)
        run: |
          mkdir -p public/books
          for tar in .ia-books/books-part-*.tar; do
            echo "📦 Extracting $tar ..."
            tar -xf "$tar" -C public/books
          done
          echo "✅ Total PDFs extracted: $(ls public/books/*.pdf | wc -l)"

      - name: تشغيل رفع IA الذكي (يحترم SlowDown)
        env:
          IA_ACCESS_KEY: ${{ secrets.IA_ACCESS_KEY }}
          IA_SECRET_KEY: ${{ secrets.IA_SECRET_KEY }}
          IA_BOOKS_DIR: ${{ github.workspace }}/public/books
          IA_CHUNKS_DIR: ${{ github.workspace }}/public/data/library-docs-chunks
          CI: true
        run: |
          echo "🚀 بدء الرفع بـ concurrency 1 (SlowDown-safe)..."
          case "${{ github.event.inputs.mode }}" in
            retry-failed) node scripts/upload-to-ia-smart.cjs --retry-failed ;;
            only-failed)  node scripts/upload-to-ia-smart.cjs --only-failed ;;
            *)            node scripts/upload-to-ia-smart.cjs ;;
          esac

      - name: رفع ملخص الرفع كـ artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-upload-summary
          path: |
            scripts/ia-upload-log.json
            scripts/ia-upload-stats.json
          retention-days: 30

      - name: Commit السجلّ المُحدَّث إلى الريبو (للإكمال في الـ run التالي)
        run: |
          git config user.name  "IA Upload Bot 🤖"
          git config user.email "bot@justice-91571.web.app"
          git add scripts/ia-upload-log.json scripts/ia-upload-stats.json
          if ! git diff --cached --quiet; then
            DONE=$(node -e "console.log(require('./scripts/ia-upload-log.json').done.length)")
            FAILED=$(node -e "console.log(require('./scripts/ia-upload-log.json').failed.length)")
            git commit -m "📚 ia-upload: log update (done=$DONE, failed=$FAILED) [skip ci]"
            git pull --rebase origin main 2>/dev/null || true
            git push || echo "⚠️ push تعذر — سيُلتقط في الـ run التالي"
            echo "✅ تم دفع السجلّ المُحدَّث"
          else
            echo "✅ لا تغييرات في السجلّ"
          fi

      - name: تنظيف الـ tars والـ stage (لتوفير disk)
        if: always()
        run: |
          rm -rf .ia-books
          echo "🧹 تم التنظيف"
