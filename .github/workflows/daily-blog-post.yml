name: 🤖 نشر المقالات القانونية (5 مرات يومياً)

on:
  schedule:
    # 9:00 ص، 12:00 ظ، 3:00 ع، 6:00 م، 9:00 م (توقيت القاهرة UTC+3)
    - cron: '0 6,9,12,15,18 * * *'
  workflow_dispatch:

jobs:
  daily-publish:
    name: نشر مقال تفصيلي جديد
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Auto-Publisher
        run: node scripts/auto-publisher.cjs
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CI: true

      - name: Commit & Push changes
        run: |
          git config user.name  "Legal Content Editor 🤖"
          git config user.email "bot@justice-91571.web.app"
          git add scripts/published-log.json public/blog/
          git diff --staged --quiet || git commit -m "🤖 Auto-publish: $(date +'%Y-%m-%d %H:%M') — مقال قانوني تفصيلي جديد"
          git push
