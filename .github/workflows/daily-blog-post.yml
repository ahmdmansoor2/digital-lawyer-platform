name: 🤖 الناشر الذكي — مقالات قانونية يومية (5 مرات يومياً)

on:
  schedule:
    # 9:00 ص، 12:00 ظ، 3:00 ع، 6:00 م، 9:00 م (توقيت القاهرة UTC+3)
    - cron: '0 6,9,12,15,18 * * *'
  workflow_dispatch:

jobs:
  smart-publish:
    name: نشر ذكي متوازي (مدونة + Facebook)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Smart Publisher (Blog + Facebook in parallel)
        run: node scripts/smart-publisher.cjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CI: true

      - name: Commit & Push changes
        run: |
          git config user.name  "Smart Legal Publisher 🤖"
          git config user.email "bot@justice-91571.web.app"
          git add scripts/published-log.json scripts/trending-topics.json scripts/blog-publisher/facebook-published-log.json public/blog/
          git diff --staged --quiet || git commit -m "🤖 Smart-publish: $(date +'%Y-%m-%d %H:%M') — مقالات قانونية + صور ذكاء اصطناعي"
          git pull --rebase origin main 2>/dev/null || true
          git push

      - name: Build & Deploy to Firebase Hosting
        run: |
          npm run build
          npx firebase deploy --only hosting:app --token "$FIREBASE_TOKEN" --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
