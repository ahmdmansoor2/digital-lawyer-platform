name: ⚖️ طلب الفهرسة اليومي الآلي (7 روابط يومياً)

on:
  schedule:
    # يعمل تلقائياً كل صباح في تمام الساعة 09:00 ص بتوقيت القاهرة (07:00 UTC)
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      day_number:
        description: 'رقم اليوم المراد إرساله (اتركه فارغاً لإرسال اليوم التالي تلقائياً)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  request-daily-indexing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Auth and Requests Libraries
        run: pip install google-auth requests

      - name: Run Daily 7 URLs Indexing Request
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON || secrets.GSC_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "${{ github.event.inputs.day_number }}" ]; then
            python google_indexing_591_automator.py --day "${{ github.event.inputs.day_number }}"
          else
            python google_indexing_591_automator.py --auto-next-day
          fi

      - name: Save Indexing Progress to Repository
        run: |
          git config user.name "Mohami Indexing Bot 🤖"
          git config user.email "bot@mohamidigital.online"
          git add indexing_progress.json
          git diff --staged --quiet || git commit -m "chore(seo): update daily indexing progress [skip ci]"
          git pull --rebase origin main 2>/dev/null || true
          git push
